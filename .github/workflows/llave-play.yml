# Entrega 84: la llave de Moca para Play App Signing, cifrada para Google.
#
# Al crear la primera versión en la Play Console, Google pregunta con qué
# llave se firma la app. Para que los pilotos pasen del APK a Play sin
# desinstalar, se le da la MISMA llave que firma el APK. Google la pide
# cifrada con su herramienta PEPK y con su llave pública de cifrado
# (`encryption_public_key.pem`, pública: está en .github/play/).
#
# Este flujo solo se lanza a mano. Toma la llave de los secretos MOCA_*, la
# cifra para Google y deja `llave-cifrada-para-google.zip` un día como
# archivo de la ejecución: solo Google puede abrirlo. Nunca imprime la llave
# ni sus contraseñas. Con «prueba», usa una llave de mentira creada en el
# momento (para comprobar el flujo sin tocar la de Moca).

name: Llave de Moca para Google Play

on:
  workflow_dispatch:
    inputs:
      prueba:
        description: "Prueba: usa una llave y un cifrado de mentira, no la llave de Moca."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  cifrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: La herramienta PEPK de Google
        run: |
          curl -fsSL -o pepk.jar https://www.gstatic.com/play-apps-publisher-rapid/signing-tool/prod/pepk.jar
          java -jar pepk.jar --help 2>&1 | head -60 || true

      - name: La llave (de Moca, o de mentira en la prueba)
        env:
          PRUEBA: ${{ inputs.prueba }}
          KEYSTORE_BASE64: ${{ secrets.MOCA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOCA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOCA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOCA_KEY_PASSWORD }}
        run: |
          umask 077
          if [ "$PRUEBA" = "true" ]; then
            clave="prueba-$(openssl rand -hex 12)"
            echo "::add-mask::$clave"
            keytool -genkeypair -keystore llave.jks -storetype JKS -alias prueba \
              -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Prueba" \
              -storepass "$clave" -keypass "$clave" > /dev/null
            # Un cifrado de mentira, en el mismo formato que el de Google.
            openssl genrsa -out cifrado-privado.pem 4096 2> /dev/null
            openssl rsa -in cifrado-privado.pem -pubout -out cifrado.pem 2> /dev/null
            rm cifrado-privado.pem
            { echo "ALIAS=prueba"; echo "CLAVE_ALMACEN=$clave"; echo "CLAVE_LLAVE=$clave"; } >> "$GITHUB_ENV"
          else
            if [ -z "$KEYSTORE_BASE64" ]; then
              echo "::error::Faltan los secretos MOCA_* de la llave."
              exit 1
            fi
            if [ ! -f .github/play/encryption_public_key.pem ]; then
              echo "::error::Falta .github/play/encryption_public_key.pem: es la llave pública de cifrado que da la Play Console."
              exit 1
            fi
            echo "$KEYSTORE_BASE64" | base64 --decode > llave.jks
            cp .github/play/encryption_public_key.pem cifrado.pem
            { echo "ALIAS=$KEY_ALIAS"; echo "CLAVE_ALMACEN=$KEYSTORE_PASSWORD"; echo "CLAVE_LLAVE=$KEY_PASSWORD"; } >> "$GITHUB_ENV"
          fi
          # La huella, para compararla con la que muestre Google.
          keytool -list -v -keystore llave.jks -storepass "$(grep -m1 '^CLAVE_ALMACEN=' "$GITHUB_ENV" | cut -d= -f2-)" \
            -alias "$(grep -m1 '^ALIAS=' "$GITHUB_ENV" | cut -d= -f2-)" \
            | grep -m1 "SHA256:" | sed 's/^[[:space:]]*/Huella de la llave: /' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cifrar la llave para Google
        run: |
          umask 077
          java -jar pepk.jar \
            --keystore=llave.jks \
            --alias="$ALIAS" \
            --output=llave-cifrada-para-google.zip \
            --include-cert \
            --rsa-aes-encryption \
            --encryption-key-path=cifrado.pem \
            --keystore-pass=env:CLAVE_ALMACEN \
            --key-pass=env:CLAVE_LLAVE
          ls -l llave-cifrada-para-google.zip
          rm -f llave.jks

      - uses: actions/upload-artifact@v4
        with:
          name: llave-cifrada-para-google${{ inputs.prueba && '-PRUEBA' || '' }}
          path: llave-cifrada-para-google.zip
          retention-days: 1
