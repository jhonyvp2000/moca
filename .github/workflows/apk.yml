# Arma el APK de Moca en GitHub, porque el entorno de desarrollo no tiene el kit de Android.
#
# - Cada push que toca app/ revisa el código, corre las pruebas y deja el APK
#   como archivo descargable de la ejecución (pestaña Actions).
# - Una etiqueta entrega-N (por ejemplo entrega-0) además publica el APK en
#   Releases, con un enlace fijo para descargarlo desde el teléfono.
#
# Firma: si existen los secretos MOCA_KEYSTORE_BASE64, MOCA_KEYSTORE_PASSWORD,
# MOCA_KEY_ALIAS y MOCA_KEY_PASSWORD, el APK se firma con la llave de Moca.
# Sin ellos se firma con una llave de depuración y no sirve para los pilotos
# (ver app/README.md).

name: APK de Moca

on:
  push:
    # Con «paths», GitHub solo arma el APK si cambió algo de la app.
    # En las etiquetas no se revisan las rutas: entrega-N siempre se arma.
    branches:
      - "**"
    paths:
      - "app/**"
      - ".github/workflows/apk.yml"
    tags:
      - "entrega-*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análisis
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      - name: Llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.MOCA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOCA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOCA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOCA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sin la llave de Moca: el APK se firma con una llave de depuración y no se podrá actualizar con uno firmado con la llave de Moca."
            echo "FIRMA=depuracion" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/moca.jks
          {
            echo "storeFile=moca.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "FIRMA=moca" >> "$GITHUB_ENV"

      - name: Armar APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Nombre del archivo
        run: |
          nombre="moca-${GITHUB_REF_NAME//\//-}-${{ github.run_number }}"
          if [ "$FIRMA" = "depuracion" ]; then nombre="$nombre-depuracion"; fi
          cp build/app/outputs/flutter-apk/app-release.apk "$nombre.apk"
          echo "APK=app/$nombre.apk" >> "$GITHUB_ENV"
          echo "NOMBRE=$nombre" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOMBRE }}
          path: ${{ env.APK }}
          retention-days: 30

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/entrega-')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "Moca · $GITHUB_REF_NAME" \
            --notes "APK de la $GITHUB_REF_NAME del prototipo V1. Firma: $FIRMA." \
            --prerelease
