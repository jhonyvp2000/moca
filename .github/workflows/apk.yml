# Arma el APK de Moca en GitHub, porque el entorno de desarrollo no tiene el kit de Android.
#
# - Cada push que toca app/ revisa el código, corre las pruebas y deja el APK
#   como archivo descargable de la ejecución (pestaña Actions).
# - Una entrega se publica en Releases, con un enlace fijo para descargar el APK
#   desde el teléfono, de dos formas: subiendo una etiqueta entrega-N, o lanzando
#   este flujo a mano (Run workflow) con el nombre de la entrega; en ese caso
#   GitHub crea la etiqueta sobre el commit armado. La versión para los
#   pilotos se publica igual, con el nombre piloto-N.
# - Desde la entrega 9 se arma un APK por tipo de procesador, más liviano:
#   arm64 (casi todos los teléfonos) y armeabi-v7a (teléfonos antiguos).
#
# Firma: si existen los secretos MOCA_KEYSTORE_BASE64, MOCA_KEYSTORE_PASSWORD,
# MOCA_KEY_ALIAS y MOCA_KEY_PASSWORD, el APK se firma con la llave de Moca.
# Sin ellos se firma con una llave de depuración y no sirve para los pilotos
# (ver app/README.md).

name: APK de Moca

on:
  push:
    # Con «paths», GitHub solo arma el APK si cambió algo de la app.
    # En las etiquetas no se revisan las rutas: entrega-N siempre se arma.
    branches:
      - "**"
    paths:
      - "app/**"
      - ".github/workflows/apk.yml"
    tags:
      - "entrega-*"
      - "piloto-*"
  workflow_dispatch:
    inputs:
      entrega:
        description: "Nombre de la entrega a publicar (entrega-N, entrega-N.M o piloto-N). Vacío: solo arma el APK."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENTREGA: ${{ (startsWith(github.ref, 'refs/tags/entrega-') || startsWith(github.ref, 'refs/tags/piloto-')) && github.ref_name || inputs.entrega }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análisis
        run: flutter analyze

      - name: Pruebas
        # Una prueba que se cuelga falla al minuto en vez de trabar el armado.
        run: flutter test --timeout 60s

      - name: Llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.MOCA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOCA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOCA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOCA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ -n "$ENTREGA" ]; then
              echo "::error::Una entrega no se publica sin la llave de Moca. Revisa los secretos MOCA_*."
              exit 1
            fi
            echo "::warning::Sin la llave de Moca: el APK se firma con una llave de depuración y no se podrá actualizar con uno firmado con la llave de Moca."
            echo "FIRMA=depuracion" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/moca.jks
          # Comprueba que la llave se lee con su contraseña y tiene el alias indicado.
          if ! keytool -list -keystore android/moca.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null; then
            echo "::error::La llave de Moca no se pudo leer: revisa MOCA_KEYSTORE_BASE64, MOCA_KEYSTORE_PASSWORD y MOCA_KEY_ALIAS."
            exit 1
          fi
          {
            echo "storeFile=moca.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "FIRMA=moca" >> "$GITHUB_ENV"

      - name: Armar APK
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Comprobar la firma
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          for abi in arm64-v8a armeabi-v7a; do
            "$apksigner" verify --print-certs "build/app/outputs/flutter-apk/app-$abi-release.apk" | tee "firma-$abi.txt"
            if [ "$FIRMA" = "moca" ] && grep -q "CN=Android Debug" "firma-$abi.txt"; then
              echo "::error::El APK $abi salió con la llave de depuración aunque había llave de Moca."
              exit 1
            fi
          done
          grep -m1 "SHA-256" firma-arm64-v8a.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Nombre de los archivos
        run: |
          nombre="moca-${ENTREGA:-${GITHUB_REF_NAME//\//-}}-${{ github.run_number }}"
          if [ "$FIRMA" = "depuracion" ]; then nombre="$nombre-depuracion"; fi
          mkdir -p publicar
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "publicar/$nombre-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "publicar/$nombre-armeabi-v7a.apk"
          ls -lh publicar
          echo "NOMBRE=$nombre" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOMBRE }}
          path: app/publicar/*.apk
          retention-days: 30

      - name: Publicar en Releases
        if: env.ENTREGA != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # entrega-N, entrega-N.M (corrección de esa entrega) o piloto-N.
          if [[ ! "$ENTREGA" =~ ^(entrega|piloto)-[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::El nombre debe ser entrega-N, entrega-N.M o piloto-N (por ejemplo entrega-3.1)."
            exit 1
          fi
          notas="APK de la $ENTREGA del prototipo V1. Firma: $FIRMA.

          - arm64: para casi todos los teléfonos.
          - armeabi-v7a: solo si el teléfono es muy antiguo y el otro no se instala."
          # La versión de los pilotos no es de prueba interna.
          prueba=""
          if [[ "$ENTREGA" == entrega-* ]]; then prueba="--prerelease"; fi
          gh release create "$ENTREGA" app/publicar/*.apk \
            --target "$GITHUB_SHA" \
            --title "Moca · $ENTREGA" \
            --notes "$notas" \
            $prueba
