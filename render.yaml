# Infraestructura de Moca en Render (docs/v1-real.md). Render lee este archivo
# al crear el «Blueprint»: un servidor web y su base PostgreSQL.
# Redis y el almacén de imágenes llegan con la lectura de fotos (entrega 14).
services:
  - type: web
    name: moca-servidor
    runtime: node
    region: virginia
    # Starter (0.5 CPU, 512 MB, USD 7 al mes): no se duerme, así el código
    # y las subidas responden en segundos (14-10-2026).
    plan: starter
    rootDir: servidor
    buildCommand: npm ci && npm run compilar
    # Al arrancar migra la base y se niega a abrir si el rol se salta el
    # aislamiento por empresa.
    startCommand: npm run iniciar
    healthCheckPath: /salud
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: moca-base
          property: connectionString
      # Twilio Verify, para el código por SMS (entrega 11). Jhony los pega en
      # Render; no van en el repositorio.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SID
        sync: false

databases:
  - name: moca-base
    region: virginia
    plan: free
    databaseName: moca
    postgresMajorVersion: "16"
    # Solo el servidor de Render entra a la base; nadie desde internet.
    ipAllowList: []
