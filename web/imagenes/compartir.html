<!doctype html>
<!-- La imagen que se ve al compartir mocanegocios.com (1200 × 630).
     Se rehace con: node web/imagenes/hacer.cjs (desde la raíz del repositorio). -->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Plus Jakarta Sans"; src: url("../sitio/fuentes/plus-jakarta-sans.woff2") format("woff2"); font-weight: 200 800; }
body { margin: 0; }
.lienzo {
  width: 1200px; height: 630px; box-sizing: border-box; padding: 72px 80px;
  display: flex; flex-direction: column; justify-content: space-between;
  background: #1D4ED8; color: #FFFFFF; font-family: "Plus Jakarta Sans", sans-serif;
}
.marca { display: flex; align-items: center; gap: 18px; font-size: 40px; font-weight: 800; }
h1 { margin: 0; font-size: 84px; line-height: 1.05; font-weight: 800; letter-spacing: -1.5px; }
p { margin: 20px 0 0; font-size: 32px; font-weight: 500; color: #E3EDFF; max-width: 900px; }
.pie { display: flex; justify-content: space-between; align-items: center; font-size: 28px; font-weight: 700; }
.chip { padding: 12px 24px; border-radius: 999px; background: #FFFFFF; color: #1D4ED8; }
</style>
</head>
<body>
<div class="lienzo">
  <div class="marca">
    <svg width="64" height="64" viewBox="0 0 28 28"><rect width="28" height="28" rx="8" fill="#FFFFFF"/><path d="M7 20V9l7 7 7-7v11" fill="none" stroke="#1D4ED8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Moca
  </div>
  <div>
    <h1>Tú vendes.<br>Moca hace las cuentas.</h1>
    <p>Cuánto tienes, quién te debe y en qué se va tu plata, desde tu celular.</p>
  </div>
  <div class="pie"><span>mocanegocios.com</span><span class="chip">14 días gratis</span></div>
</div>
</body>
</html>
