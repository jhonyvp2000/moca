<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg>

<div style="font-size: 14px; font-weight: 700; color: #1E3A8A">Moca</div>

<button aria-pressed="false" style="min-height: 48px; padding: 4px 8px; border: 1px solid #B5C2D6; border-radius: 12px; background: #FFFFFF; color: #0F1F3D; font: inherit; font-size: 14px; font-weight: 600">No lo sé</button>
