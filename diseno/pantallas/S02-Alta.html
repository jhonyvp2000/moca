<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moca · S02 · Alta inicial</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#F3F6FB}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F6FB; color: #0F1F3D; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">

<div style="display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px">
<a href="S00-Bienvenida.html" aria-label="Volver" style="width: 44px; height: 44px; border: 1px solid #D8E0EC; border-radius: 12px; background: #FFFFFF; color: #0F1F3D; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
</a>
<div style="font-size: 14px; font-weight: 600; color: #4B5A75">Un minuto y listo</div>
</div>

<div style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 18px; flex-grow: 1">
<h1 style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.2">Cuéntale a Moca de tu negocio</h1>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="alta-nombre" style="font-size: 14px; font-weight: 700">¿Cómo se llama?</label>
<input id="alta-nombre" type="text" value="Bodega Don Lucho" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: 1px solid #8696B0; border-radius: 12px; background: #FFFFFF; color: #0F1F3D; font: inherit; font-size: 16px; font-weight: 600">
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; font-weight: 700">¿Qué tipo de negocio es?</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button aria-pressed="true" style="min-height: 44px; padding: 0 16px; border: 2px solid #1D4ED8; border-radius: 22px; background: #E3ECFB; color: #1E3A8A; font: inherit; font-size: 14px; font-weight: 700">Bodega</button>
<button aria-pressed="false" style="min-height: 44px; padding: 0 16px; border: 1px solid #B5C2D6; border-radius: 22px; background: #FFFFFF; color: #0F1F3D; font: inherit; font-size: 14px; font-weight: 600">Restaurante</button>
<button aria-pressed="false" style="min-height: 44px; padding: 0 16px; border: 1px solid #B5C2D6; border-radius: 22px; background: #FFFFFF; color: #0F1F3D; font: inherit; font-size: 14px; font-weight: 600">Servicios</button>
<button aria-pressed="false" style="min-height: 44px; padding: 0 16px; border: 1px solid #B5C2D6; border-radius: 22px; background: #FFFFFF; color: #0F1F3D; font: inherit; font-size: 14px; font-weight: 600">Otro</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; font-weight: 700">¿Cuánta plata tienes hoy en cada sitio?</div>
<div style="font-size: 14px; line-height: 1.4; color: #4B5A75">Un aproximado sirve. Lo ajustas en tu primer arqueo.</div>
<div style="background: #FFFFFF; border: 1px solid #D8E0EC; border-radius: 16px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #E4EAF3">
<label for="alta-efectivo" style="flex-grow: 1; font-size: 15px; font-weight: 600">Efectivo</label>
<span style="font-size: 15px; color: #4B5A75">S/</span>
<input id="alta-efectivo" type="text" inputmode="decimal" value="1,200" style="width: 110px; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8696B0; border-radius: 10px; background: #FFFFFF; color: #0F1F3D; font: inherit; font-size: 16px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums">
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #E4EAF3">
<label for="alta-yape" style="flex-grow: 1; font-size: 15px; font-weight: 600">Yape</label>
<span style="font-size: 15px; color: #4B5A75">S/</span>
<input id="alta-yape" type="text" inputmode="decimal" value="450" style="width: 110px; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8696B0; border-radius: 10px; background: #FFFFFF; color: #0F1F3D; font: inherit; font-size: 16px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums">
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px">
<label for="alta-banco" style="flex-grow: 1; font-size: 15px; font-weight: 600">Banco</label>
<span style="font-size: 15px; color: #4B5A75">S/</span>
<input id="alta-banco" type="text" inputmode="decimal" value="2,000" style="width: 110px; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8696B0; border-radius: 10px; background: #FFFFFF; color: #0F1F3D; font: inherit; font-size: 16px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums">
</div>
</div>
</div>

<div style="display: flex; align-items: center; gap: 12px">
<label for="alta-cierre" style="flex-grow: 1; font-size: 14px; line-height: 1.4"><strong>¿A qué hora cierras?</strong><br><span style="color: #4B5A75">Moca te recuerda anotar la venta del día.</span></label>
<input id="alta-cierre" type="text" value="9:00 p. m." style="width: 120px; height: 50px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8696B0; border-radius: 12px; background: #FFFFFF; color: #0F1F3D; font: inherit; font-size: 16px; font-weight: 700; text-align: center">
</div>
</div>

<div style="padding: 12px 20px 12px; display: flex; flex-direction: column; gap: 4px">
<a href="S03-Vacio.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #1D4ED8; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">Listo, empezar</a>
<a href="S03-Vacio.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; color: #0F1F3D; font-size: 15px; font-weight: 600; text-decoration: none">No sé cuánto tengo, lo pongo después</a>
</div>

</div>
</body>
</html>
