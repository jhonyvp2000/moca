name: moca
description: "Moca: Tú vendes. Moca hace las cuentas."
publish_to: 'none'

# El número después de «+» lo pone GitHub Actions en cada armado.
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  speech_to_text: ^7.5.0
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.2
  connectivity_plus: ^7.3.2
  pdf: ^3.13.1
  share_plus: ^13.3.1
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  # Plus Jakarta Sans (licencia SIL OFL 1.1, ver assets/fuentes/OFL.txt),
  # incluida en la app para que se vea igual sin señal.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fuentes/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fuentes/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fuentes/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fuentes/PlusJakartaSans-Bold.ttf
          weight: 700
